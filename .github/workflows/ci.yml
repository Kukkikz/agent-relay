name: CI

on:
  push:
  workflow_dispatch:

env:
  IMAGE_NAME: agent-relay
  # kind names its node container "<cluster-name>-control-plane"; the local
  # cluster used by this repo is `kind create cluster --name agent-relay`.
  KIND_CLUSTER: agent-relay
  KIND_NODE: agent-relay-control-plane

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run unit tests (SQLite, in-process)
        run: uv run pytest -q

  integration-tests:
    runs-on: ubuntu-latest
    # A real PostgreSQL instance, not SQLite, so this exercises the same
    # advisory-lock transaction path the Compose/kind deployments use.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_relay
          POSTGRES_PASSWORD: agent_relay
          POSTGRES_DB: agent_relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_relay -d agent_relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        # Separate from starting the server below: `uv run` installs lazily
        # on first invocation, and racing that download against the
        # readiness poll below made the poll time out before uvicorn had
        # even started.
        run: uv sync
      - name: Start Agent Relay against PostgreSQL
        env:
          # This job has no `container:`, so it (and the service above) run
          # directly on the runner's network rather than a shared per-job
          # Docker network - reach the service via its published port on
          # localhost, not its service-id hostname.
          RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@localhost:5432/agent_relay
        run: |
          uv run uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo $! > uvicorn.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/ready
      - name: Run integration tests over HTTP against PostgreSQL
        env:
          AGENT_RELAY_BASE_URL: http://127.0.0.1:8000
        run: uv run pytest -m integration -v -s
      - name: Stop Agent Relay
        if: always()
        run: kill "$(cat uvicorn.pid)" 2>/dev/null || true

  build:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute a unique image tag
        id: tag
        run: |
          tag="ci-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: docker build -t "$IMAGE_NAME:${{ steps.tag.outputs.tag }}" .
      - name: Save image for the deploy job
        run: docker save "$IMAGE_NAME:${{ steps.tag.outputs.tag }}" -o agent-relay-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: agent-relay-image
          path: agent-relay-image.tar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Only meaningful if unit-tests, integration-tests, and build all
    # succeeded - and only under `act`. A real GitHub-hosted runner is an
    # ephemeral VM with no local kind cluster to deploy into (yours only
    # exists on your own machine, unreachable from GitHub's
    # infrastructure), so every step below is gated on `env.ACT`, which
    # `act` sets to "true" and real GitHub Actions leaves unset. (A
    # job-level `if:` can't read `env` - it's evaluated before the runner
    # environment exists - so this has to be a per-step condition; the job
    # still shows up and "succeeds" on real GitHub Actions, just by
    # skipping every step.)
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.ACT }}
      - uses: actions/download-artifact@v4
        if: ${{ env.ACT }}
        with:
          name: agent-relay-image
      - name: Load the built image into Docker
        if: ${{ env.ACT }}
        run: docker load -i agent-relay-image.tar

      - name: Load the image into the kind node
        if: ${{ env.ACT }}
        env:
          TAG: ${{ needs.build.outputs.tag }}
        # kind has no daemon of its own; a node is a container running
        # containerd, so "loading" an image means importing it directly into
        # that container's containerd content store via `ctr`. This is what
        # `kind load docker-image` does under the hood, done by hand here so
        # the job needs nothing beyond the Docker CLI/socket. Stream the
        # save straight into the node's `ctr import` over stdin rather than
        # writing an intermediate tar file first - simpler and avoids
        # relying on this job container's own filesystem for anything.
        run: docker save "$IMAGE_NAME:${TAG}" | docker exec -i "${KIND_NODE}" ctr -n k8s.io images import -

      - name: Configure kubectl for the kind cluster
        if: ${{ env.ACT }}
        # The node's own kubeconfig points at its container hostname
        # (resolvable only on the `kind` Docker network, which this job's
        # container can't join - Docker refuses to connect a container
        # already using `--network host`, act's default, to any other
        # network). Instead, rewrite it to the API server's *host-published*
        # port: this job's container shares the Docker host's network
        # namespace under host networking, so 127.0.0.1:<published-port> is
        # already directly reachable, no network join required.
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          api_port="$(docker port "${KIND_NODE}" 6443/tcp | head -n1 | cut -d: -f2)"
          docker exec "${KIND_NODE}" cat /etc/kubernetes/admin.conf \
            | sed "s#server: https://.*:6443#server: https://127.0.0.1:${api_port}#" \
            > kubeconfig.yaml
          echo "KUBECONFIG=$PWD/kubeconfig.yaml" >> "$GITHUB_ENV"

      - name: Apply manifests
        if: ${{ env.ACT }}
        run: kubectl apply -f k8s/

      - name: Point the Deployment at the new image
        if: ${{ env.ACT }}
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: kubectl set image deployment/agent-relay agent-relay="$IMAGE_NAME:${TAG}"

      - name: Wait for the rollout to finish
        if: ${{ env.ACT }}
        run: kubectl rollout status deployment/agent-relay --timeout=120s
